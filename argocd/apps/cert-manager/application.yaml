apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  sources:
    - chart: cert-manager
      repoURL: https://charts.jetstack.io
      targetRevision: v1.21.3
      helm:
        valueFiles:
          - $values/argocd/apps/cert-manager/values.yaml
    - repoURL: https://github.com/alexvplle/infrastructure_as_code
      targetRevision: main
      ref: values
    - repoURL: https://github.com/alexvplle/infrastructure_as_code
      targetRevision: main
      path: argocd/apps/cert-manager/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
