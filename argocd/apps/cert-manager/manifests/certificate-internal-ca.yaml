---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  isCA: true
  commonName: internal-ca
  secretName: internal-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
