---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: digital-garden
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexvplle/infrastructure_as_code
    targetRevision: main
    path: argocd/charts/digital-garden
  destination:
    server: https://kubernetes.default.svc
    namespace: digital-garden
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
