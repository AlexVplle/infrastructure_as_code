---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: minecraft
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: minecraft
      app.kubernetes.io/name: minecraft
  podMetricsEndpoints:
    - port: metrics
