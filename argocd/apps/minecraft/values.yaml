---
image:
  tag: java17

resources:
  requests:
    memory: 8Gi
    cpu: 2
  limits:
    memory: 8Gi

startupProbe:
  enabled: true
  failureThreshold: 120

minecraftServer:
  eula: "TRUE"
  type: FORGE
  version: "1.18.2"
  forgeVersion: "40.3.11"
  memory: 6G
  serviceType: LoadBalancer
  worldSaveName: ragnamod-vii

extraEnv:
  GENERIC_PACK: https://mediafilez.forgecdn.net/files/7659/582/Ragnamod-VII-7.2.1-Server.zip
  OVERRIDE_WHITELIST: "true"
  OVERRIDE_OPS: "true"

envFrom:
  - secretRef:
      name: minecraft-whitelist

persistence:
  dataDir:
    enabled: true
    Size: 20Gi
