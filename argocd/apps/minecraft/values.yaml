---
image:
  tag: java17

resources:
  requests:
    memory: 12Gi
    cpu: 2
  limits:
    memory: 12Gi

startupProbe:
  enabled: true
  failureThreshold: 120

minecraftServer:
  eula: "TRUE"
  type: FORGE
  version: "1.18.2"
  forgeVersion: "40.3.11"
  memory: 9G
  serviceType: LoadBalancer
  worldSaveName: ragnamod-vii
  modrinth:
    projects:
      - chunky:T7Yrm4uq

extraEnv:
  GENERIC_PACK: https://mediafilez.forgecdn.net/files/7659/582/Ragnamod-VII-7.2.1-Server.zip
  OVERRIDE_WHITELIST: "true"
  OVERRIDE_OPS: "true"

envFrom:
  - secretRef:
      name: minecraft-whitelist

sidecarContainers:
  - name: mc-monitor
    image: itzg/mc-monitor:1.20.1
    args: [export-for-prometheus]
    env:
      - name: EXPORT_SERVERS
        value: localhost
    ports:
      - name: metrics
        containerPort: 8080

persistence:
  dataDir:
    enabled: true
    Size: 20Gi
