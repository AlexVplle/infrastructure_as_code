---
image:
  tag: java17

resources:
  requests:
    memory: 10Gi
    cpu: 2
  limits:
    memory: 10Gi

startupProbe:
  enabled: true
  failureThreshold: 120

minecraftServer:
  eula: "TRUE"
  type: FORGE
  version: "1.20.1"
  forgeVersion: "47.4.20"
  memory: 8G
  serviceType: LoadBalancer
  worldSaveName: bettermc
  modrinth:
    projects:
      - chunky:4FTDk9wv

extraEnv:
  GENERIC_PACK: https://mediafilez.forgecdn.net/files/9555/2/BMC4_ServerPack_v63hf.zip
  SIMULATION_DISTANCE: "8"
  OVERRIDE_WHITELIST: "true"
  OVERRIDE_OPS: "true"

envFrom:
  - secretRef:
      name: minecraft-whitelist

sidecarContainers:
  - name: mc-monitor
    image: itzg/mc-monitor:1.20.1
    args: [export-for-prometheus]
    env:
      - name: EXPORT_SERVERS
        value: localhost
    ports:
      - name: metrics
        containerPort: 8080

persistence:
  dataDir:
    enabled: true
    Size: 20Gi
