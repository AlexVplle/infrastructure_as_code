---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
spec:
  project: default
  sources:
    - chart: openbao
      repoURL: https://openbao.github.io/openbao-helm
      targetRevision: 0.30.7
      helm:
        valueFiles:
          - $values/argocd/apps/openbao/values.yaml
    - repoURL: https://github.com/alexvplle/infrastructure_as_code
      targetRevision: main
      ref: values
    - repoURL: https://github.com/alexvplle/infrastructure_as_code
      targetRevision: main
      path: argocd/apps/openbao/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
