---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
spec:
  secretName: openbao-tls
  duration: 8760h
  dnsNames:
    - openbao
    - openbao.openbao
    - openbao.openbao.svc
    - openbao.openbao.svc.cluster.local
  ipAddresses:
    - 127.0.0.1
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: internal-ca
