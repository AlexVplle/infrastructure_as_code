---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: toktoktok
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexvplle/infrastructure_as_code
    targetRevision: main
    path: argocd/charts/toktoktok
  destination:
    server: https://kubernetes.default.svc
    namespace: toktoktok
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
